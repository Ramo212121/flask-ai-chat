<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask AI Chat{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background video -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
    </video>

    <header class="header">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Flask AI Chat Logo" class="logo-icon">
            <span class="logo-text">Flask AI Chat</span>
        </a>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Built with Flask</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
